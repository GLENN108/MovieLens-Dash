<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <title>MovieLens — Discover the patterns</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="MovieLens home">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span>movie<span class="brand-accent">lens</span><small>DATA STUDIO</small></span>
        </a>
        <div class="nav-label">WORKSPACE</div>
        <nav class="nav-list" aria-label="Main navigation">
          <button class="nav-item active" data-view="overview"><span class="nav-icon">▦</span>Overview</button>
          <button class="nav-item" data-view="explore"><span class="nav-icon">⌁</span>Explore data</button>
          <button class="nav-item" data-view="recommend"><span class="nav-icon">✳</span>Recommendations</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="dataset-card">
            <span class="status-dot" id="sidebar-status-dot"></span>
            <div><strong>MovieLens 1M</strong><small id="sidebar-status">Data not loaded</small></div>
          </div>
          <div class="sidebar-note">A little curiosity goes a long way.</div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb">Your workspace <span>/</span> <strong id="breadcrumb-page">Overview</strong></div>
          <div class="topbar-right"><span class="live-dot"></span><span id="topbar-status">Getting things ready</span></div>
        </header>
        <section id="notice" class="notice hidden" role="status"></section>
        <section id="app-content" aria-live="polite">
          <div class="loading-state"><span class="spinner"></span><span>Getting your dashboard ready…</span></div>
        </section>
        <footer class="page-footer">Made for movie people <span>✦</span> MovieLens 1M</footer>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
